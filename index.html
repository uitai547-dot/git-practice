<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funny Monkey 🐒</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #ff4b2b;
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 20px;
        }

        .monkey {
            font-size: 150px;
            animation: bounce 1.5s infinite;
            margin: 20px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1) rotate(-2deg);
        }

        #joke {
            margin-top: 25px;
            font-weight: bold;
            color: #8e44ad;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🐒 Monkey Madness! 🌴</h1>

        <div class="monkey">🙈</div>

        <p>
            Welcome to the world's most suspicious monkey website!
        </p>

        <button onclick="tellJoke()">
            🍌 Give Me a Banana Joke
        </button>

        <div id="joke"></div>
    </div>

    <script>
        function tellJoke() {
            const jokes = [
                "🍌 Why did the monkey eat the banana? Because it was appealing!",
                "🐒 What do monkeys use to make calls? APE phones!",
                "😂 Why did the monkey cross the road? To prove he wasn't chicken!",
                "🍌 This monkey has gone completely bananas!"
            ];

            const randomJoke =
                jokes[Math.floor(Math.random() * jokes.length)];

            document.getElementById("joke").textContent = randomJoke;
        }
    </script>

</body>
</html>
